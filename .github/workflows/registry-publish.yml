name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry via GitHub OIDC — no browser
# login, no stored secret. The workflow's OIDC token proves this repo owns the
# io.github.PCBZ/* namespace, so `mcp-publisher login github-oidc` just works.
#
# Runs AFTER the prod apply, not beside it (#140). It used to trigger on the
# same `v*` tag as deploy.yml, so the two raced: server.json advertises a live
# address, and that claim is only true once the deploy has succeeded. v1.2.3 and
# v1.2.4 both failed to deploy while this workflow reported success — had it
# been doing anything, the registry would now name two versions that never
# shipped.
#
# The endpoint comes from the azure root's own Terraform output, not from an
# MCP_ENDPOINT variable. A variable is one more thing to set, forget, or let
# drift from the deployment it describes; the output is the address that was
# just applied. That the variable was never set at all is why 15 consecutive
# releases published nothing while reporting success (#140).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC token to authenticate to the registry
      contents: read
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
      # No `ref:` — the default is right in both directions. Called from
      # deploy.yml on a tag it checks out that tag, which is the code being
      # released; dispatched by hand it checks out the default branch.
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"

      - name: Resolve the deployed endpoint
        id: tf
        working-directory: deploy/terraform/azure
        run: |
          terraform init \
            -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }} \
            -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }} \
            -backend-config=container_name=${{ vars.TFSTATE_CONTAINER }} \
            -backend-config=key=azure.tfstate
          endpoint="$(terraform output -raw mcp_endpoint)"
          # An error here must fail the run. This workflow spent fifteen
          # releases green because its no-endpoint path was a `::notice::` and a
          # skip — a publish workflow that cannot publish has failed.
          if [ -z "$endpoint" ]; then
            echo "::error::terraform output mcp_endpoint is empty — is the app deployed?"
            exit 1
          fi
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"

      # Synced in the runner and published from there; this never pushes back to
      # main (branch protection blocks it, and publishing does not need it). The
      # committed server.json is kept correct on its own.
      - name: Sync server.json
        env:
          ENDPOINT: ${{ steps.tf.outputs.endpoint }}
        run: |
          # On a tag the version comes from the tag; on a manual dispatch it
          # comes from the committed server.json, which is what main says is
          # current.
          if [ "${{ github.ref_type }}" = tag ]; then
            jq --arg url "$ENDPOINT" --arg v "${GITHUB_REF_NAME#v}" \
               '.remotes[0].url = $url | .version = $v' server.json > server.json.tmp
          else
            jq --arg url "$ENDPOINT" '.remotes[0].url = $url' server.json > server.json.tmp
          fi
          mv server.json.tmp server.json
          echo "publishing $(jq -r '"\(.name) \(.version)"' server.json) at $ENDPOINT"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
