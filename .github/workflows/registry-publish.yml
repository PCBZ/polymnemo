name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry via GitHub OIDC — no browser
# login, no stored secret. The workflow's OIDC token proves this repo owns the
# io.github.PCBZ/* namespace, so `mcp-publisher login github-oidc` just works.
#
# The public endpoint comes from either the workflow_dispatch `mcp_endpoint`
# input (type it in when you click "Run workflow") or, if that's blank, the
# MCP_ENDPOINT repo variable. On a release tag (v*) the version is taken from the
# tag. It syncs server.json (url [+ version on a tag]), commits that back to
# main, then publishes. No-ops if no endpoint is available from either source.

on:
  workflow_dispatch:
    inputs:
      mcp_endpoint:
        description: "Public MCP endpoint URL, e.g. https://<app>.azurecontainerapps.io/mcp (leave blank to use the MCP_ENDPOINT repo variable)."
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token to authenticate to the registry
      contents: write # push the synced server.json back to main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # edit + push server.json on the default branch

      - name: Resolve endpoint (dispatch input, else repo variable)
        id: check
        env:
          INPUT_ENDPOINT: ${{ inputs.mcp_endpoint }}
          VAR_ENDPOINT: ${{ vars.MCP_ENDPOINT }}
        run: |
          endpoint="${INPUT_ENDPOINT:-$VAR_ENDPOINT}"
          if [ -z "$endpoint" ]; then
            echo "::notice::No endpoint — pass the mcp_endpoint input or set the MCP_ENDPOINT variable. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync server.json (url from input/variable, version from tag)
        if: steps.check.outputs.ready == 'true'
        env:
          ENDPOINT: ${{ steps.check.outputs.endpoint }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            jq --arg url "$ENDPOINT" --arg v "${GITHUB_REF_NAME#v}" \
               '.remotes[0].url = $url | .version = $v' server.json > server.json.tmp
          else
            jq --arg url "$ENDPOINT" '.remotes[0].url = $url' server.json > server.json.tmp
          fi
          mv server.json.tmp server.json

      - name: Commit + push if server.json changed
        if: steps.check.outputs.ready == 'true'
        run: |
          if ! git diff --quiet -- server.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server.json
            git commit -m "chore(registry): sync server.json (${GITHUB_REF_NAME})"
            git push origin HEAD:main
          fi

      - name: Install mcp-publisher
        if: steps.check.outputs.ready == 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate (GitHub OIDC)
        if: steps.check.outputs.ready == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        if: steps.check.outputs.ready == 'true'
        run: ./mcp-publisher publish
