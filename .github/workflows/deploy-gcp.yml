name: deploy gcp (backup)

# BACKUP failover to Cloud Run — present but NEVER auto-triggered (manual only).
# Azure Container Apps is the primary deploy (deploy.yml). This applies ONLY the
# gcp/ root and assumes the shared neon/ + r2/ state already exists (provisioned
# by the Azure deploy). It reads that shared state from the Azure Storage
# backend, so it needs ARM_* creds in addition to GCP auth.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (optional; defaults to the commit SHA so each new commit rolls out)"
        required: false
        default: ""

concurrency: deploy-gcp

permissions:
  contents: read

env:
  # azurerm backend + shared neon/r2 state reads (state lives in Azure Storage).
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  # Terraform input variables.
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_api_keys: ${{ secrets.POLYMNEMO_API_KEYS }}
  # Backup path: don't hijack the registered (Azure) MCP_ENDPOINT.
  TF_VAR_publish_mcp_endpoint: "false"
  TF_VAR_tfstate_resource_group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TF_VAR_tfstate_storage_account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TF_VAR_tfstate_container: ${{ vars.TFSTATE_CONTAINER }}
  TF_BACKEND: >-
    -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}
    -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    -backend-config=container_name=${{ vars.TFSTATE_CONTAINER }}

jobs:
  deploy:
    name: gcp (build image + deploy Cloud Run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2

      # 1) Bootstrap: enable APIs + create the Artifact Registry (image empty, so
      #    the Cloud Run service is skipped this pass).
      - name: Terraform apply (bootstrap)
        working-directory: deploy/terraform/gcp
        run: |
          terraform init $TF_BACKEND -backend-config=key=gcp.tfstate
          terraform apply -auto-approve

      # 2) Build + push the image to Artifact Registry, tagged with the commit
      #    (a static tag would leave the Cloud Run revision unchanged).
      - name: Build image
        working-directory: deploy/terraform/gcp
        run: |
          tag="${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}"
          repo="$(terraform output -raw image_repo)"
          gcloud builds submit ../../.. --tag "$repo/polymnemo:$tag"
          echo "IMAGE=$repo/polymnemo:$tag" >> "$GITHUB_ENV"

      # 3) Deploy Cloud Run with the built image.
      - name: Terraform apply (deploy)
        working-directory: deploy/terraform/gcp
        run: |
          terraform apply -auto-approve -var "image=$IMAGE"
          echo "MCP endpoint: $(terraform output -raw mcp_endpoint)"
