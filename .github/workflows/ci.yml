name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Enables the PostgresStore tests; the rest of the suite is offline.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Type-check (mypy)
        run: mypy src/polymnemo
      - name: Apply schema
        run: psql "$TEST_DATABASE_URL" -f scripts/schema.sql
      - name: Run tests
        run: pytest --cov-report=json --cov-report=xml --junitxml=pytest.xml
      - name: Test + coverage summary
        if: always() # summarize even when tests fail
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, xml.etree.ElementTree as ET

          root = ET.parse("pytest.xml").getroot()
          suite = root.find("testsuite") if root.tag == "testsuites" else root
          total = int(suite.get("tests", 0))
          failed = int(suite.get("failures", 0))
          errors = int(suite.get("errors", 0))
          skipped = int(suite.get("skipped", 0))
          passed = total - failed - errors - skipped
          cov = json.load(open("coverage.json"))["totals"]["percent_covered"]

          print("## Test results\n")
          print("| ✅ Passed | ❌ Failed | ⚠️ Errors | ⏭️ Skipped | 📊 Coverage |")
          print("|---|---|---|---|---|")
          print(f"| {passed} | {failed} | {errors} | {skipped} | {cov:.1f}% |")
          PY

      # Codecov adds what the summary above cannot: coverage of the lines this
      # PR changed, reported on the PR itself. A total is easy to keep high
      # while adding untested code — 30 new uncovered lines move 84.8% by a
      # third of a point. The step summary stays: it carries the pass/fail
      # counts, which Codecov does not, and it keeps working if Codecov is down.
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
