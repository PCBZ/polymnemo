name: smoke

# Post-deploy checks against a *running* deployment (#129).
#
# A `terraform apply` is called good as soon as the app returns any HTTP status,
# which only proves the container started. #123 (every bearer key 401'd) and
# #128 (token pages 404, POLYMNEMO_LOG_FORMAT never injected) both cleared that
# bar. These jobs assert the contracts that live in configuration, where
# in-process tests cannot reach.
#
#   resolve --> endpoints --> logs
#
# `logs` runs second on purpose: it drives no traffic of its own, it looks for
# the lines the `endpoints` job just produced.
#
# This is a GATE — the prod apply waits on it — so a failure here keeps a bad
# revision off production.
#
# It only ever targets the TEST deployment. Pointing it at production would mean
# authenticated calls against real rows, and a key that opens production
# memories sitting in CI for the sake of a test. The trade is named rather than
# hidden: test and prod carry separate configuration, so this proves the image
# and test's config, never prod's.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  TF_BACKEND: >-
    -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}
    -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    -backend-config=container_name=${{ vars.TFSTATE_CONTAINER }}

jobs:
  # Read the deployment's own coordinates out of Terraform state rather than
  # threading them in as inputs, so `workflow_dispatch` works exactly like the
  # call from deploy.yml and there is one source of truth for the app's URL.
  resolve:
    name: resolve (test deployment coordinates)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_url: ${{ steps.tf.outputs.base_url }}
      app_name: ${{ steps.tf.outputs.app_name }}
      workspace: ${{ steps.tf.outputs.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"
      - id: tf
        working-directory: deploy/terraform/azure-test
        run: |
          terraform init $TF_BACKEND -backend-config=key=azure-test.tfstate
          base_url="$(terraform output -raw service_url)"
          app_name="$(terraform output -raw app_name)"
          workspace="$(terraform output -raw log_workspace_id)"
          # A missing output makes `terraform output` fail, but the command
          # substitution around it does not fail the `echo` — so without this
          # the empty value reaches the suite, which skips itself for lack of
          # configuration and the whole check passes having asserted nothing.
          for pair in "service_url=$base_url" "app_name=$app_name" \
                      "log_workspace_id=$workspace"; do
            [ -n "${pair#*=}" ] || {
              echo "::error::terraform output ${pair%%=*} is empty — is the test app deployed?"
              exit 1
            }
          done
          {
            echo "base_url=$base_url"
            echo "app_name=$app_name"
            echo "workspace=$workspace"
          } >> "$GITHUB_OUTPUT"

  endpoints:
    name: endpoints (route contracts)
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/smoke/requirements.txt
      # Only what the HTTP checks need. Installing the package would drag in the
      # embedding model for a suite that never imports polymnemo.
      - run: pip install -r tests/smoke/requirements.txt
      - name: Assert every route's contract
        env:
          POLYMNEMO_SMOKE_URL: ${{ needs.resolve.outputs.base_url }}
          POLYMNEMO_SMOKE_KEY: ${{ secrets.POLYMNEMO_TEST_SMOKE_KEY }}
        run: |
          # The suite skips itself when unconfigured so the offline unit tests
          # stay runnable, and that is exactly how a post-deploy check goes green
          # while asserting nothing — the #128 failure mode again.
          [ -n "$POLYMNEMO_SMOKE_KEY" ] || {
            echo "::error::POLYMNEMO_TEST_SMOKE_KEY is unset, so every"\
              "authenticated check would silently skip. It must also appear in"\
              "POLYMNEMO_TEST_API_KEYS."
            exit 1
          }
          # confcutdir: without it pytest also loads tests/conftest.py, which
          # imports polymnemo — and this job installs the HTTP deps only, on
          # purpose. A dev machine has the package installed, so this failure
          # can only ever appear in CI.
          pytest tests/smoke/test_endpoints.py -v -o addopts="" \
            --confcutdir=tests/smoke

  logs:
    name: logs (structured output)
    needs: [resolve, endpoints]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/smoke/requirements.txt
      - run: pip install -r tests/smoke/requirements.txt
      # No `az login` step: the suite calls the Log Analytics query API over
      # HTTP and gets its own token from the ARM_* values already in `env`.
      - name: Assert the logs arrive in the expected shape
        env:
          POLYMNEMO_SMOKE_WORKSPACE: ${{ needs.resolve.outputs.workspace }}
          POLYMNEMO_SMOKE_APP: ${{ needs.resolve.outputs.app_name }}
        # See the endpoints job: the ancestor conftest imports polymnemo.
        run: >-
          pytest tests/smoke/test_logs.py -v
          -o addopts="" --confcutdir=tests/smoke
