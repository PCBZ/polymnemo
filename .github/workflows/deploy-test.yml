name: deploy (test env)

# On-demand deploy of the DEBUG test env (deploy/terraform/test): a Neon branch
# of prod + a `polymnemo-test` Container App running a chosen image at
# POLYMNEMO_LOG_LEVEL=DEBUG, so its reads emit the #96 observe log into Log
# Analytics (measure with scripts/measure_test_env.py).
#
# Separate from the release deploy because the test env runs a *chosen* image
# (one that includes the #96 observe log, i.e. built from #102 or later) — not
# necessarily the released image. Reuses the same GitHub secrets/vars as the
# Azure deploy; no new secrets needed.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image the test env runs. Must include the #96 observe log (built from #102+). e.g. ghcr.io/pcbz/polymnemo:v1.1.3"
        required: true

concurrency: deploy-test

permissions:
  contents: read

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  # Terraform inputs for the test root — all reused from the existing config.
  TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
  TF_VAR_api_keys: ${{ secrets.POLYMNEMO_API_KEYS }}
  TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  TF_VAR_image: ${{ inputs.image }}
  TF_VAR_tfstate_resource_group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TF_VAR_tfstate_storage_account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TF_VAR_tfstate_container: ${{ vars.TFSTATE_CONTAINER }}
  TF_BACKEND: >-
    -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}
    -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    -backend-config=container_name=${{ vars.TFSTATE_CONTAINER }}

jobs:
  test-env:
    name: test env (Neon branch + DEBUG app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"
      - name: Terraform apply (test env)
        working-directory: deploy/terraform/test
        run: |
          terraform init $TF_BACKEND -backend-config=key=test.tfstate
          terraform apply -auto-approve
          url="$(terraform output -raw service_url)"
          echo "test MCP endpoint: ${url}/mcp"
          echo "Waiting for the test app at $url to come up…"
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url") || code=000
            echo "  [$i] HTTP $code"
            case "$code" in
              2??|3??|4??) echo "Test app is up (HTTP $code)."; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::Test app never responded (~5 min) — check the container logs."
          exit 1
