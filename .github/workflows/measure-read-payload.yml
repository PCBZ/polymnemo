name: Measure read payload

# On-demand measurement for #89/#96: how many bytes the embedding column costs on
# read paths. Runs against an ephemeral pgvector Postgres (never production),
# then visualises the result in the run summary + uploads JSON/SVG artifacts.

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Number of rows to measure"
        default: "200"
      content_chars:
        description: "Content chars per row"
        default: "500"

jobs:
  measure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16 # matches Neon's Postgres 16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Apply schema
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          psql "$TEST_DATABASE_URL" -f scripts/schema.sql

      - name: Measure
        run: |
          python scripts/measure_read_payload.py \
            --rows "${{ inputs.rows }}" \
            --content-chars "${{ inputs.content_chars }}" \
            --json-out payload.json

      - name: Render report
        run: |
          python scripts/render_payload_report.py payload.json \
            --svg-out payload.svg >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: read-payload-report
          path: |
            payload.json
            payload.svg
