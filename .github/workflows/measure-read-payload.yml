name: Measure read payload

# On-demand measurement for #89/#96: how many bytes the embedding column costs on
# read paths. Runs the designed sweep (content size A + result size B) against an
# ephemeral pgvector Postgres (never production), renders a matplotlib chart +
# a data table in the run summary, and uploads the JSON/PNG as artifacts.

on:
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17 # pg17 needed for EXPLAIN (SERIALIZE)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + matplotlib
        run: pip install -e . matplotlib

      - name: Apply schema
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          psql "$TEST_DATABASE_URL" -f scripts/schema.sql

      - name: Sweep (content size A + result size B)
        run: python scripts/measure_read_payload.py --sweep --json-out sweep.json

      - name: Render report (chart + table)
        run: |
          python scripts/plot_read_payload.py sweep.json \
            --png read_payload.png >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: read-payload-report
          path: |
            sweep.json
            read_payload.png
