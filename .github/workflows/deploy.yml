name: deploy (azure)

# Manual, staged deploy to Azure Container Apps: neon (shared Postgres) ->
# schema -> r2 (shared media bucket) -> build image -> azure app. All secrets
# come from GitHub Secrets/Variables (see scripts/setup-github-secrets.sh and
# scripts/bootstrap-tfstate-azure.sh); nothing is stored in the repo.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build and deploy"
        required: false
        default: v1

# Never let two deploys race the shared Terraform state.
concurrency: deploy-azure

permissions:
  contents: read

env:
  # azurerm provider + backend auth (service principal).
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  # cloudflare provider auth (r2 root).
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # Terraform input variables.
  TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
  TF_VAR_cf_account_id: ${{ secrets.CF_ACCOUNT_ID }}
  TF_VAR_api_keys: ${{ secrets.POLYMNEMO_API_KEYS }}
  TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  TF_VAR_acr_name: ${{ vars.ACR_NAME }}
  TF_VAR_tfstate_resource_group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TF_VAR_tfstate_storage_account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TF_VAR_tfstate_container: ${{ vars.TFSTATE_CONTAINER }}
  # Shared -backend-config (the per-root `key` is appended per step).
  TF_BACKEND: >-
    -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}
    -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    -backend-config=container_name=${{ vars.TFSTATE_CONTAINER }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"

      # 1) Shared Postgres.
      - name: Terraform apply — neon
        working-directory: deploy/terraform/neon
        run: |
          terraform init $TF_BACKEND -backend-config=key=neon.tfstate
          terraform apply -auto-approve

      - name: Apply schema.sql to Neon
        working-directory: deploy/terraform/neon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          conn="$(terraform output -raw connection_uri)"
          psql "$conn" -v ON_ERROR_STOP=1 -f ../../../scripts/schema.sql

      # 2) Shared media bucket.
      - name: Terraform apply — r2
        working-directory: deploy/terraform/r2
        run: |
          terraform init $TF_BACKEND -backend-config=key=r2.tfstate
          terraform apply -auto-approve

      # 3) Build the image IN ACR (Terraform, no az/docker) + deploy the app —
      #    one apply. `-replace` forces a fresh build each run (schedule_run_now
      #    otherwise runs only on create; harmless warning on the very first run).
      - name: Terraform apply — azure (build + deploy)
        working-directory: deploy/terraform/azure
        env:
          TF_VAR_image_tag: ${{ inputs.image_tag }}
          TF_VAR_context_access_token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          terraform init $TF_BACKEND -backend-config=key=azure.tfstate
          terraform apply -auto-approve \
            -replace=module.container_apps.azurerm_container_registry_task_schedule_run_now.build
          echo "MCP endpoint: $(terraform output -raw mcp_endpoint)"
