name: deploy (azure)

# Deploy to Azure Container Apps. Primary trigger is a **v* release tag**: it
# builds + runs that exact tag (image tagged with the version) and, via
# registry-publish.yml (same tag trigger), publishes the registry entry — so one
# tag = deployed state = registered version. workflow_dispatch stays for manual/
# emergency deploys of a branch. All secrets come from GitHub Secrets/Variables
# (see scripts/setup-github-secrets.sh and scripts/bootstrap-tfstate-azure.sh);
# nothing is stored in the repo.
#
# Job graph (GitHub renders this live in the run's "graph" view):
#
#   neon --> schema --+
#   r2 --------------+--> azure
#
# neon and r2 run in parallel. schema waits for neon; azure waits for r2 + schema
# (neon is covered transitively via schema, and the app never starts before its
# tables exist).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag for a manual deploy (optional; defaults to the commit SHA). Ignored on a v* tag push."
        required: false
        default: ""

# Never let two deploys race the shared Terraform state.
concurrency: deploy-azure

permissions:
  contents: read

env:
  # azurerm provider + backend auth (service principal).
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  # cloudflare provider auth (r2 root).
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  # Terraform input variables.
  TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
  TF_VAR_cf_account_id: ${{ secrets.CF_ACCOUNT_ID }}
  TF_VAR_api_keys: ${{ secrets.POLYMNEMO_API_KEYS }}
  TF_VAR_azure_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  TF_VAR_tfstate_resource_group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TF_VAR_tfstate_storage_account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TF_VAR_tfstate_container: ${{ vars.TFSTATE_CONTAINER }}
  # Shared -backend-config (each job appends its own `key`).
  TF_BACKEND: >-
    -backend-config=resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}
    -backend-config=storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    -backend-config=container_name=${{ vars.TFSTATE_CONTAINER }}

jobs:
  neon:
    name: neon (shared Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"
      - name: Terraform apply
        working-directory: deploy/terraform/neon
        run: |
          terraform init $TF_BACKEND -backend-config=key=neon.tfstate
          terraform apply -auto-approve

  r2:
    name: r2 (shared media bucket)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"
      - name: Terraform apply
        working-directory: deploy/terraform/r2
        run: |
          terraform init $TF_BACKEND -backend-config=key=r2.tfstate
          terraform apply -auto-approve

  schema:
    name: schema (apply schema.sql)
    needs: [neon]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"
      # psql ships preinstalled on ubuntu-latest — no apt step needed.
      - name: Apply schema.sql to Neon
        working-directory: deploy/terraform/neon
        run: |
          terraform init $TF_BACKEND -backend-config=key=neon.tfstate
          conn="$(terraform output -raw connection_uri)"
          psql "$conn" -v ON_ERROR_STOP=1 -f ../../../scripts/schema.sql

  azure:
    name: azure (build image + deploy app)
    needs: [r2, schema]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `packages: write` lets this job push the image to GHCR with GITHUB_TOKEN.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # ACR Tasks are blocked on personal/student subscriptions, so build the
      # image here and push it to GHCR (free, and shows on the repo's Packages).
      # Tag = the version on a v* tag, else the dispatch input, else the SHA.
      # Context values go through env (not straight into run:) to avoid shell
      # injection from a crafted tag/dispatch input.
      - name: Resolve image reference
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$REF_TYPE" = tag ]; then tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          else tag="$SHA"; fi
          echo "TF_VAR_image=ghcr.io/${OWNER,,}/polymnemo:${tag}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # build-push-action gives us a GitHub Actions layer cache, so unchanged
      # layers (deps + the embedding-model bake) are reused across deploys.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.TF_VAR_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.2"
      - name: Terraform apply (deploy app)
        working-directory: deploy/terraform/azure
        env:
          # A fresh revision suffix every run forces a real rollout even when the
          # image ref is unchanged (e.g. re-deploying a tag after making the GHCR
          # package Public). run_id-run_attempt is unique across re-runs.
          TF_VAR_revision_suffix: r${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          terraform init $TF_BACKEND -backend-config=key=azure.tfstate
          terraform apply -auto-approve
          url="$(terraform output -raw service_url)"
          echo "MCP endpoint: ${url}/mcp"
          # The app pulls a PUBLIC image with no credentials, so a private/
          # misconfigured package would be a green-but-broken apply. Poll the app
          # until it answers (any HTTP status = the container started & pulled)
          # and fail the job loudly otherwise.
          echo "Waiting for the app at $url to come up…"
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
            echo "  [$i] HTTP $code"
            if [ "$code" != 000 ]; then echo "App is up (HTTP $code)."; exit 0; fi
            sleep 10
          done
          echo "::error::App never responded (~5 min) — is the GHCR package Public?"
          exit 1
