name: Coverage dashboard (Pages)

# Publishes two off-the-shelf HTML reports to GitHub Pages on every push to main:
# the coverage.py `htmlcov` report and the pytest-html test report (no custom
# dashboard code). Self-contained: runs the suite against a pgvector service.
# configure-pages enables Pages on first run if the token can; otherwise enable
# it once (Settings -> Pages -> Source: GitHub Actions).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Exercises the Postgres tests so coverage reflects the real store.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]" pytest-cov pytest-html
      - name: Apply schema
        run: psql "$TEST_DATABASE_URL" -f scripts/schema.sql
      - name: Test — coverage (htmlcov) + report (pytest-html)
        run: |
          mkdir -p site
          pytest --cov=polymnemo --cov-report=html \
                 --html=site/tests.html --self-contained-html
      - name: Assemble site
        run: |
          cp -r htmlcov site/htmlcov
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>polymnemo — CI reports</title>
          <style>
            body{font:16px/1.7 system-ui,-apple-system,sans-serif;max-width:40rem;
                 margin:3rem auto;padding:0 1rem;color-scheme:light dark}
            a{color:#1565c0} li{margin:.4rem 0}
          </style></head><body>
          <h1>polymnemo — CI reports</h1>
          <ul>
            <li><a href="tests.html">Test report</a> — pytest-html</li>
            <li><a href="htmlcov/index.html">Coverage report</a> — coverage.py</li>
          </ul>
          </body></html>
          HTML
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
