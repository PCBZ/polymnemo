name: Coverage dashboard (Pages)

# Publishes a test + coverage dashboard to GitHub Pages on every push to main.
# Self-contained: runs the suite with coverage (against a pgvector service),
# builds site/index.html (scripts/build_dashboard.py), and ships the full htmlcov
# report alongside. configure-pages enables Pages on first run if the token can;
# otherwise enable it once (Settings -> Pages -> Source: GitHub Actions).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Exercises the Postgres tests so coverage reflects the real store.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]" pytest-cov
      - name: Apply schema
        run: psql "$TEST_DATABASE_URL" -f scripts/schema.sql
      - name: Test + coverage
        run: pytest --cov=polymnemo --cov-report=html --cov-report=json --junitxml=pytest.xml
      - name: Build dashboard
        run: |
          python scripts/build_dashboard.py
          cp -r htmlcov site/htmlcov
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
