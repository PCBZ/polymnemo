name: '🔎 Gemini Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # ratchet:actions/checkout@v6

      # Fetch the diff deterministically (not via the model) into a file that the
      # model reads with `cat`.
      - name: 'Fetch PR diff'
        env:
          GH_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
        run: |-
          gh pr diff '${{ github.event.pull_request.number || github.event.issue.number }}' \
            --repo '${{ github.repository }}' > pr.diff
          echo "diff bytes: $(wc -c < pr.diff)"

      - name: 'Run Gemini pull request review'
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        id: 'gemini_pr_review'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          # Trust the checked-out workspace so the CLI can `cat` the diff file
          # headlessly (folder-trust otherwise blocks shell tools).
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-review'
          # Explicitly set the PR number to handle `issue_comment` triggers (which GitHub treats as issues, not PRs)
          github_pr_number: '${{ github.event.pull_request.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 15
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)"
                ]
              }
            }
          # The model can't run shell tools in CI (gemini-cli denies
          # run_shell_command by policy in non-interactive mode), so it only
          # READS the diff and WRITES structured JSON; the next step posts it as
          # an inline PR review with a deterministic script.
          prompt: |-
            You are an automated code reviewer for a GitHub pull request.

            1. Read the diff by running:  cat pr.diff
            2. Review it against this repository's GEMINI.md standards (already
               loaded as context). Grade each finding by priority — high / medium
               / low.
            3. Output ONLY a single JSON object (no markdown, no code fences):
               {
                 "summary": "<GitHub-markdown overall review, starting with
                   '## 🤖 Gemini review'; if nothing is worth flagging, say so>",
                 "comments": [
                   {
                     "path": "<repo-relative file path, exactly as in the diff>",
                     "line": <integer line number in the NEW version of the file —
                       MUST be a line shown as added '+' or context ' ' in a diff
                       hunk, never a removed '-' line>,
                     "severity": "high|medium|low",
                     "body": "<the specific comment for that line>"
                   }
                 ]
               }
               Put each line-specific finding in "comments", anchored to a real
               changed/added line in the diff (empty array if none). Keep the
               broader assessment in "summary". Do NOT post anything yourself and
               do NOT run any commands other than `cat pr.diff`.

            Do not comment on pure formatting, do not add filler praise, and do not
            repeat what CI already catches (lint, type checks, tests).

      # Materialise the model's JSON to a file. toJSON safely escapes it into the
      # script (no shell injection, no env var carrying the payload).
      - name: 'Write review.json'
        if: ${{ steps.gemini_pr_review.outputs.summary != '' }}
        uses: 'actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b' # ratchet:actions/github-script@v7
        with:
          script: |
            require('fs').writeFileSync(
              'review.json',
              ${{ toJSON(steps.gemini_pr_review.outputs.summary) }},
            )

      # Post the findings as inline PR comments (severity dot 🔴/🟠/🟡) + a
      # summary. PR / sha are passed as args (trusted github context); repo comes
      # from $GITHUB_REPOSITORY, auth from $GH_TOKEN, the payload from review.json.
      - name: 'Post inline review'
        if: ${{ steps.gemini_pr_review.outputs.summary != '' }}
        env:
          GH_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
        run: |
          .github/scripts/post_gemini_review.sh \
            '${{ github.event.pull_request.number || github.event.issue.number }}' \
            '${{ github.event.pull_request.head.sha }}'
