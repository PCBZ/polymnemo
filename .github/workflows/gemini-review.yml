name: '🔎 Gemini Review'

on:
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false

concurrency:
  group: '${{ github.workflow }}-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  review:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 7
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Mint identity token'
        id: 'mint_identity_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'
          permission-contents: 'read'
          permission-issues: 'write'
          permission-pull-requests: 'write'

      - name: 'Checkout repository'
        uses: 'actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8' # ratchet:actions/checkout@v6

      # Fetch the diff deterministically (not via the model) into a file that the
      # model reads with `cat`.
      - name: 'Fetch PR diff'
        env:
          GH_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
        run: |-
          gh pr diff '${{ github.event.pull_request.number || github.event.issue.number }}' \
            --repo '${{ github.repository }}' > pr.diff
          echo "diff bytes: $(wc -c < pr.diff)"

      - name: 'Run Gemini pull request review'
        uses: 'google-github-actions/run-gemini-cli@v0' # ratchet:exclude
        id: 'gemini_pr_review'
        env:
          GITHUB_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          # gh CLI (used by the model to post inline comments) reads GH_TOKEN.
          GH_TOKEN: '${{ steps.mint_identity_token.outputs.token || secrets.GITHUB_TOKEN || github.token }}'
          # Trust the checked-out workspace so the CLI can run `cat` / `gh`
          # headlessly (folder-trust otherwise blocks shell tools).
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          ISSUE_TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          ISSUE_BODY: '${{ github.event.pull_request.body || github.event.issue.body }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
          # Head commit the inline comments anchor to.
          COMMIT_ID: '${{ github.event.pull_request.head.sha }}'
          ADDITIONAL_CONTEXT: '${{ inputs.additional_context }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
        with:
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gemini_debug: '${{ fromJSON(vars.GEMINI_DEBUG || vars.ACTIONS_STEP_DEBUG || false) }}'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          google_api_key: '${{ secrets.GOOGLE_API_KEY }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          upload_artifacts: '${{ vars.UPLOAD_ARTIFACTS }}'
          workflow_name: 'gemini-review'
          # Explicitly set the PR number to handle `issue_comment` triggers (which GitHub treats as issues, not PRs)
          github_pr_number: '${{ github.event.pull_request.number }}'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 15
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "tools": {
                "core": [
                  "run_shell_command(cat)",
                  "run_shell_command(gh)"
                ]
              }
            }
          # The model reads the diff and posts its own inline review comments with
          # gh, one per finding, tagged by a priority dot.
          prompt: |-
            You are an automated code reviewer for a GitHub pull request.

            1. Read the diff:  cat pr.diff
            2. Review it against this repository's GEMINI.md standards. Ignore pure
               formatting, filler praise, and anything CI already catches (lint,
               type checks, tests).
            3. For each real issue on a changed line, post an INLINE comment on
               that exact line by running (one gh call per finding):

                 gh api --method POST \
                   "repos/$REPOSITORY/pulls/$PULL_REQUEST_NUMBER/comments" \
                   -f commit_id="$COMMIT_ID" \
                   -f path="<file path exactly as in the diff>" \
                   -F line=<line number in the NEW version of the file> \
                   -f side="RIGHT" \
                   -f body="<dot> <your comment>"

               Begin each comment body with a priority dot:
                 🔴 = high, 🟠 = medium, 🟡 = low.
               The line MUST be a line shown as added '+' or context ' ' in a diff
               hunk (never a removed '-' line), or the API will reject it.
            4. Finally, post one short summary:

                 gh pr comment "$PULL_REQUEST_NUMBER" --repo "$REPOSITORY" \
                   --body "## 🤖 Gemini review — 🔴 <n> · 🟠 <n> · 🟡 <n>. <one-line takeaway>"

            If nothing is worth flagging, skip step 3 and just post the summary
            saying it looks good. Do not post duplicate comments.
