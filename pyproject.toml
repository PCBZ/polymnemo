[project]
name = "polymnemo"
version = "0.0.1"
description = "A shared long-term memory across any LLM, over MCP"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "PCBZ" }]
keywords = ["mcp", "memory", "llm", "embeddings", "pgvector", "fastmcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Kept intentionally minimal for the Phase 0 #1 skeleton. Later issues add their
# own deps: embeddings (#3 -> fastembed, numpy), Postgres store (#6 -> psycopg,
# pgvector), tests (#13 -> pytest).
dependencies = [
    "fastmcp>=2.0",
    # Declarative env-var config (already pulled in transitively by fastmcp;
    # depended on directly since config.py imports it).
    "pydantic-settings>=2.0",
    # Local, deterministic embeddings (ONNX, no API key). Brings numpy.
    # Pinned to the 0.8.x line: fastembed 0.8.0 switched this model's pooling
    # from CLS to mean, which changes the vectors. Stored embeddings and query
    # embeddings must come from the SAME pooling, so crossing that boundary
    # (e.g. an old <0.8 install, or a future 0.9 that changes it again) would
    # silently degrade recall. Bumping past <0.9 is a deliberate, reviewed step
    # that may require re-embedding everything. See issue #38.
    "fastembed>=0.8,<0.9",
    # Token-aware chunking (Rust; respects the model's context window).
    "semantic-text-splitter>=0.13",
    # HF tokenizer used to size chunks in tokens (also a fastembed dep).
    "tokenizers>=0.15",
    # Global token-bucket rate limiter (opt-in via POLYMNEMO_RATELIMIT_ENABLED).
    "pyrate-limiter>=3,<4",
]

[project.optional-dependencies]
# Durable store (Neon + pgvector). Imported lazily by PostgresStore.
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "polymnemo[postgres]",  # single source of truth for the DB deps
]

[project.scripts]
polymnemo = "polymnemo.server:main"

[project.urls]
Homepage = "https://github.com/PCBZ/polymnemo"
Repository = "https://github.com/PCBZ/polymnemo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymnemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
