[project]
name = "polymnemo"
version = "1.0.0"
description = "A shared long-term memory across any LLM, over MCP"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "PCBZ" }]
keywords = ["mcp", "memory", "llm", "embeddings", "pgvector", "fastmcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Kept intentionally minimal for the Phase 0 #1 skeleton. Later issues add their
# own deps: embeddings (#3 -> fastembed, numpy), Postgres store (#6 -> psycopg,
# pgvector), tests (#13 -> pytest).
dependencies = [
    "fastmcp>=2.0",
    # Declarative env-var config (already pulled in transitively by fastmcp;
    # depended on directly since config.py imports it).
    "pydantic-settings>=2.0",
    # Local, deterministic embeddings (ONNX, no API key). Brings numpy.
    # Pinned to the 0.8.x line: fastembed 0.8.0 switched this model's pooling
    # from CLS to mean, which changes the vectors. Stored embeddings and query
    # embeddings must come from the SAME pooling, so crossing that boundary
    # (e.g. an old <0.8 install, or a future 0.9 that changes it again) would
    # silently degrade recall. Bumping past <0.9 is a deliberate, reviewed step
    # that may require re-embedding everything. See issue #38.
    "fastembed>=0.8,<0.9",
    # Token-aware chunking (Rust; respects the model's context window).
    "semantic-text-splitter>=0.13",
    # HF tokenizer used to size chunks in tokens (also a fastembed dep).
    "tokenizers>=0.15",
    # Global token-bucket rate limiter (opt-in via POLYMNEMO_RATELIMIT_ENABLED).
    "pyrate-limiter>=3,<4",
    # Durable store (Neon + pgvector): the SQLAlchemy ORM/core, the psycopg
    # driver, and pgvector's SQLAlchemy type. Required — the server runs with
    # POLYMNEMO_REQUIRE_DATABASE=true and the deployed image always uses it.
    # (Still imported lazily by PostgresStore, but always installed.)
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    # Object storage for media memories (#44): boto3 for the S3/R2 backend.
    # Required — the deploy always enables media (POLYMNEMO_BLOB_BACKEND=s3).
    # (Still imported lazily by S3BlobStore, but always installed.)
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
polymnemo = "polymnemo.server:main"

[project.urls]
Homepage = "https://github.com/PCBZ/polymnemo"
Repository = "https://github.com/PCBZ/polymnemo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymnemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage on by default (term-missing). CI adds json/junit reports for its
# summary. No --cov-fail-under gate — this reports, it doesn't block.
addopts = "-ra --cov=polymnemo --cov-report=term-missing"

[tool.coverage.run]
source = ["polymnemo"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# pycodestyle/pyflakes + isort + pyupgrade + bugbear + ruff-native rules.
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# conftest sets env vars BEFORE importing polymnemo, so its imports can't be at
# the top of the file.
"tests/conftest.py" = ["E402"]
