[project]
name = "polymnemo"
version = "1.1.0"
description = "A shared long-term memory across any LLM, over MCP"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "PCBZ" }]
keywords = ["mcp", "memory", "llm", "embeddings", "pgvector", "fastmcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastmcp>=2.0",
    "pydantic-settings>=2.0",
    "fastembed>=0.8,<0.9",
    "semantic-text-splitter>=0.13",
    "tokenizers>=0.15",
    "pyrate-limiter>=3,<4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "asgi-lifespan>=2.1",  # run the ASGI app's lifespan in the transport test
    "mypy>=1.11",
]

[project.scripts]
polymnemo = "polymnemo.server:main"

[project.urls]
Homepage = "https://github.com/PCBZ/polymnemo"
Repository = "https://github.com/PCBZ/polymnemo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymnemo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage on by default (term-missing). CI adds json/junit reports for its
# summary. No --cov-fail-under gate — this reports, it doesn't block.
addopts = "-ra --cov=polymnemo --cov-report=term-missing"

[tool.coverage.run]
source = ["polymnemo"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# pycodestyle/pyflakes + isort + pyupgrade + bugbear + ruff-native rules.
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# conftest sets env vars BEFORE importing polymnemo, so its imports can't be at
# the top of the file.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
# Introducing mypy on an existing codebase: third-party libs without type stubs
# are treated as Any for now. Tighten (per-module strictness) over time.
ignore_missing_imports = true
